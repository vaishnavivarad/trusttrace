services:
  - type: web
    name: trusttrace-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npx prisma generate
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: TRUST_PROXY
        value: "1"
      - key: STORAGE_MODE
        value: postgres
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: FRONTEND_PUBLIC_URL
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: BLOCKCHAIN_RPC_URL
        value: https://coralrpc.mstblockchain.com
      - key: BLOCKCHAIN_CHAIN_ID
        value: "54635"
      - key: BLOCKCHAIN_CONTRACT_ADDRESS
        sync: false
      - key: BLOCKCHAIN_RELAYER_PRIVATE_KEY
        sync: false
      - key: AUTO_RECOVER_LOCAL_CHAIN
        value: "false"
      - key: IPFS_PROVIDER
        value: pinata
      - key: PINATA_JWT
        sync: false
      - key: IPFS_GATEWAY_URL
        value: https://gateway.pinata.cloud/ipfs
      - key: ML_SERVICE_URL
        sync: false
      - key: MAX_PLAUSIBLE_SPEED_KMH
        value: "120"
      - key: MAX_GPS_ACCURACY_METERS
        value: "150"
