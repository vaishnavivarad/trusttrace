services:
  - type: web
    name: trusttrace-app
    runtime: node
    rootDir: .
    plan: free
    buildCommand: npm --prefix frontend install && npm --prefix frontend run build && npm --prefix backend install && npm --prefix backend run prisma:generate
    startCommand: npm --prefix backend start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: TRUST_PROXY
        value: "1"
      - key: STORAGE_MODE
        value: file
      - key: SESSION_SECRET
        generateValue: true
      - key: BLOCKCHAIN_RPC_URL
        value: https://mariorpc.mstblockchain.com
      - key: BLOCKCHAIN_CHAIN_ID
        value: "4646"
      - key: BLOCKCHAIN_CONTRACT_ADDRESS
        value: "0xb7A79C5437D00d32A8770a5905B5d1483c91A130"
      - key: BLOCKCHAIN_RELAYER_PRIVATE_KEY
        sync: false
      - key: AUTO_RECOVER_LOCAL_CHAIN
        value: "false"
      - key: IPFS_PROVIDER
        value: pinata
      - key: PINATA_JWT
        sync: false
      - key: IPFS_GATEWAY_URL
        value: https://gateway.pinata.cloud/ipfs
      - key: ML_SERVICE_URL
        sync: false
      - key: MAX_PLAUSIBLE_SPEED_KMH
        value: "120"
      - key: MAX_GPS_ACCURACY_METERS
        value: "150"
